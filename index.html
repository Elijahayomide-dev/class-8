<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook sign up page</title>
</head>
<body>
    <i>Facebook sign up page</i>
    <link rel="stylesheet" href="style.css">
    <h1>What's your name?</h1>

    

    <label for="First name">Enter your first name</label>
    <input type="text" placeholder="Enter your first name">
    <br>
    <br>

    <label for="Surname">Enter your surname</label>
    <input type="text" placeholder="Enter your surname">
    <br>
    <br>

    <h2>What's your date of birth?</h2>

    <label for="Date_of_birth">D.O.B</label>
    <input type="Date" placeholder="D.O.B">
    <br>
    <br>

    <h1>How old are you?</h1>

    <label for="Age">Enter your age</label>
    <input type="Age" placeholder="Age">
    <br>
    <br>

    <h1>What's your gender</h1>

    <label for="Gender">Male</label>
    <input type="radio" name="gender" placeholder="Male">
    <label for="Gender">Female</label>
    <input type="radio" name="gender" placeholder="Female">
    <br>
    <br>

    <h2>What's your mobile number?</h2>

    <label for="Number">Enter your mobile number</label>
    <input type="Number" placeholder="number">
    <br>
    <br>

    <h2>Create a password</h2>

    <label for="Password">Enter your password</label>
    <input type="Password" placeholder="Password">
    <br>
    <br>

    <input type="submit" value="sign up" style="background-color: blue; color: aliceblue;">
    <link rel="stylesheet" href="style.css">



</body>
</html>
